name: orbit-issues

# Toute nouvelle issue naît non validée, quelle que soit la façon dont elle
# est créée (site, gh, API). Le valideur retire le label.
on:
  issues:
    types: [opened]

permissions:
  issues: write

jobs:
  needs-validation:
    runs-on: ubuntu-latest
    steps:
      - name: Pose le label needs-validation
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          ISSUE: ${{ github.event.issue.number }}
        run: |
          gh api --method POST "repos/$GH_REPO/issues/$ISSUE/labels" \
            -f 'labels[]=needs-validation' --silent

name: orbit

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: La PR est liée à une issue
        env:
          BODY: ${{ github.event.pull_request.body }}
        run: |
          if ! grep -qiE 'closes #[0-9]+' <<< "$BODY"; then
            echo "::error::La description de la PR doit contenir « Closes #N »."
            exit 1
          fi

      - name: Le titre de la PR suit Conventional Commits
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          pattern='^(build|chore|ci|docs|feat|fix|perf|refactor|revert|style|test)(\([a-z0-9-]+\))?!?: .+'
          if ! grep -qE "$pattern" <<< "$TITLE" || [ ${#TITLE} -gt 100 ]; then
            echo "::error::Titre non conforme : $TITLE"
            exit 1
          fi

      - name: Les commits suivent Conventional Commits
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          pattern='^(build|chore|ci|docs|feat|fix|perf|refactor|revert|style|test)(\([a-z0-9-]+\))?!?: .+'
          fail=0
          while IFS= read -r msg; do
            if ! grep -qE "$pattern" <<< "$msg" || [ ${#msg} -gt 100 ]; then
              echo "::error::Commit non conforme : $msg"
              fail=1
            fi
          done < <(git log --no-merges --format=%s "$BASE..$HEAD")
          exit $fail

      - name: Aucun secret dans le code
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # À remplir à l'installation : la commande `check` de la
      # section 2 d'AGENTS.md, précédée de l'installation de la stack.
      # - name: Check
      #   run: npm run check

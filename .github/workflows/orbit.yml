name: orbit

# pull_request exécute la version de ce fichier présente dans la PR : seules
# les vérifications qui ont besoin de son code sont ici. Les autres sont dans
# orbit-policy.yml.
on:
  pull_request:

permissions:
  contents: read

jobs:
  code:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      # Le binaire plutôt que gitleaks-action : pas de licence exigée pour les
      # organisations, pas de token ni de permission en écriture.
      - name: No secrets in the code
        env:
          VERSION: 8.30.1
          SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          cd "$RUNNER_TEMP"
          curl -sSfL -o gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v$VERSION/gitleaks_${VERSION}_linux_x64.tar.gz"
          echo "$SHA256  gitleaks.tar.gz" | sha256sum -c -
          tar -xzf gitleaks.tar.gz gitleaks
          ./gitleaks git --no-banner --redact --verbose \
            --log-opts="--no-merges $BASE..$HEAD" "$GITHUB_WORKSPACE"

      - name: Project section of AGENTS.md is filled
        run: |
          if [ "$GITHUB_REPOSITORY" = tabiitha/orbit-agent ]; then
            echo "orbit-agent is the template: its placeholders stay."
            exit 0
          fi
          section=$(awk '/^## 2\./ { on = 1; next } /^## / { on = 0 } on' AGENTS.md 2> /dev/null || true)
          if [ -z "$section" ]; then
            echo "::error::Section 2 of AGENTS.md not found: AGENTS.md must exist and have a '## 2.' heading."
            exit 1
          fi
          left=$(grep -E '\[[^]]+\]([^(]|$)|(^|[^A-Za-z])TBD([^A-Za-z]|$)' <<< "$section" || true)
          if [ -n "$left" ]; then
            echo "::error::Section 2 of AGENTS.md still has placeholders or TBD. Fill each field, then delete the instructions comment."
            echo "$left"
            exit 1
          fi

      - name: Check
        run: |
          if [ "$GITHUB_REPOSITORY" = tabiitha/orbit-agent ]; then
            echo "orbit-agent is the template: its own check is orbit-self.yml."
            exit 0
          fi
          echo "::error::No check command is configured. Replace this step with the setup of the stack and the check command from section 2 of AGENTS.md."
          exit 1

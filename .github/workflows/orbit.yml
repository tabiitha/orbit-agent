name: orbit

# pull_request exécute la version de ce fichier présente dans la PR : seules
# les vérifications qui ont besoin de son code sont ici. Les autres sont dans
# orbit-policy.yml.
on:
  pull_request:

permissions:
  contents: read

jobs:
  code:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Aucun secret dans le code
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # À remplir à l'installation : la commande `check` de la
      # section 2 d'AGENTS.md, précédée de l'installation de la stack.
      # - name: Check
      #   run: npm run check
